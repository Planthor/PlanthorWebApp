sonar.projectKey = Planthor_Planthor_ClientFrontEndWebApp
sonar.organization = planthor
sonar.sourceEncoding = UTF-8
sonar.sources = src
sonar.exclusions = node_modules/**,coverage/**,.svelte-kit/**,build/**
